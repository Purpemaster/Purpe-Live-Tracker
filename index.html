<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purple Pepe Radio Galaxy</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .planet-container {
      display: flex;
      gap: 40px;
    }

    .planet {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #000);
      box-shadow: 0 0 20px #fff, 0 0 40px #fff;
      animation: pulse 2s infinite;
      cursor: pointer;
    }

    .planet:nth-child(1) {
      background: radial-gradient(circle at 30% 30%, #ff00ff, #800080);
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
    }

    .planet:nth-child(2) {
      background: radial-gradient(circle at 30% 30%, #00ffff, #008080);
      box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    }

    .planet:nth-child(3) {
      background: radial-gradient(circle at 30% 30%, #ffff00, #808000);
      box-shadow: 0 0 20px #ffff00, 0 0 40px #ffff00;
    }

    .planet:nth-child(4) {
      background: radial-gradient(circle at 30% 30%, #ff0000, #800000);
      box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 20px #fff, 0 0 40px #fff;
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 0 30px #fff, 0 0 60px #fff;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 20px #fff, 0 0 40px #fff;
      }
    }
  </style>
</head>
<body>
  <div class="planet-container">
    <div class="planet" data-src="https://streams.ilovemusic.de/iloveradio14.mp3"></div>
    <div class="planet" data-src="http://listen.181fm.com/181-beat_64k.aac"></div>
    <div class="planet" data-src="http://listen.181fm.com/181-reggae_64k.aac"></div>
    <div class="planet" data-src="http://listen.181fm.com/181-rock_64k.aac"></div>
  </div>

  <audio id="player" autoplay></audio>

  <script>
    const player = document.getElementById('player');
    const planets = document.querySelectorAll('.planet');

    planets.forEach(planet => {
      planet.addEventListener('click', () => {
        const src = planet.getAttribute('data-src');
        if (src) {
          player.src = src;
          player.play();
        }
      });
    });
  </script>
</body>
</html>
