<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purple Pepe Donation Tracker</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://i.imgur.com/O1aFt2n.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }

    .container {
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .progress-bar {
      width: 80%;
      height: 20px;
      background: #222;
      border-radius: 10px;
      margin: 20px auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, cyan, magenta);
      width: 0%;
      transition: width 0.5s ease-in-out;
    }

    .glow-box {
      margin: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      display: inline-block;
    }

    .qr-section canvas {
      margin-top: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .wallet-container {
      margin-top: 10px;
      font-size: 14px;
    }

    .donate-buttons {
      margin-top: 20px;
    }

    .donate-button {
      background: #8000ff;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      text-decoration: none;
      border-radius: 10px;
      display: inline-block;
      font-weight: bold;
    }

    .planet-radio {
      margin-top: 40px;
    }

    .planet-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 20px;
    }

    .planet {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #000);
      box-shadow: 0 0 20px #fff, 0 0 40px #fff;
      animation: pulse 3s infinite ease-in-out;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .planet:hover {
      transform: scale(1.2);
    }

    .planet:nth-child(1) {
      background: radial-gradient(circle at 30% 30%, #ff00ff, #4b0082);
      box-shadow: 0 0 25px #ff00ff, 0 0 50px #ff00ff;
    }

    .planet:nth-child(2) {
      background: radial-gradient(circle at 30% 30%, #00ffff, #006666);
      box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff;
    }

    .planet:nth-child(3) {
      background: radial-gradient(circle at 30% 30%, #ffff00, #999900);
      box-shadow: 0 0 25px #ffff00, 0 0 50px #ffff00;
    }

    .planet:nth-child(4) {
      background: radial-gradient(circle at 30% 30%, #ff3300, #990000);
      box-shadow: 0 0 25px #ff3300, 0 0 50px #ff3300;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
</head>

<body>
  <div class="container">
    <h1>Purple Pepe Donation Tracker</h1>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill-1"></div>
    </div>

    <div class="glow-box" id="current-amount">$0.00</div>
    <div class="glow-box" id="last-updated">Letztes Update: --:--:--</div>
    <div class="glow-box">$20,000 Ziel</div>

    <div class="qr-section">
      <canvas id="wallet-qr"></canvas>
      <div class="wallet-container">
        <span id="wallet-address">9uo3TB4a8synap9VMNpby6nzmnMs9xJWmgo2YKJHZWVn</span><br>
        <button onclick="copyWallet()">📋 Kopieren</button>
      </div>
    </div>

    <div class="donate-buttons">
      <a href="#" id="donate-sol" class="donate-button">Donation SOL</a>
      <a href="#" id="donate-purpe" class="donate-button">Donation PURPE</a>
    </div>

    <div class="planet-radio">
      <h2>🪐 Purple Pepe Radio</h2>
      <div class="planet-bar">
        <div class="planet" data-src="https://streams.ilovemusic.de/iloveradio14.mp3"></div>
        <div class="planet" data-src="http://listen.181fm.com/181-beat_64k.aac"></div>
        <div class="planet" data-src="http://listen.181fm.com/181-reggae_64k.aac"></div>
        <div class="planet" data-src="http://listen.181fm.com/181-rock_64k.aac"></div>
      </div>
    </div>
  </div>

  <audio id="player" autoplay></audio>

  <script>
    const walletAddress = "9uo3TB4a8synap9VMNpby6nzmnMs9xJWmgo2YKJHZWVn";
    new QRious({
      element: document.getElementById('wallet-qr'),
      value: `solana:${walletAddress}`,
      size: 200,
      background: 'white',
      foreground: '#8000ff'
    });

    function copyWallet() {
      navigator.clipboard.writeText(walletAddress).then(() => alert("Wallet copied"));
    }

    document.getElementById("donate-sol").addEventListener("click", () => {
      const link = `solana:${walletAddress}?amount=1&label=Purple%20Pepe%20Donation`;
      window.location.href = link;
    });

    document.getElementById("donate-purpe").addEventListener("click", () => {
      const link = `solana:${walletAddress}?amount=3000000&spl-token=HBoNJ5v8g71s2boRivrHnfSB5MVPLDHHyVjruPfhGkvL&label=Purple%20Pepe%20Donation`;
      window.location.href = link;
    });

    const planets = document.querySelectorAll('.planet');
    const player = document.getElementById('player');

    planets.forEach(planet => {
      planet.addEventListener('click', () => {
        const src = planet.getAttribute('data-src');
        player.src = src;
        player.play();
      });
    });

    // Dummy data for tracker fill
    const dummyUSD = 13543.67;
    const percent = (dummyUSD / 20000) * 100;
    document.getElementById("progress-fill-1").style.width = percent + "%";
    document.getElementById("current-amount").textContent = "$" + dummyUSD.toFixed(2);
    document.getElementById("last-updated").textContent = "Letztes Update: " + new Date().toLocaleTimeString();
  </script>
</body>
</html>
