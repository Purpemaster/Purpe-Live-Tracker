<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purple Pepe Radio</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 120px);
      grid-template-rows: repeat(2, 120px);
      gap: 20px;
    }

    .crystal {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #7b00ff, #00ffe7);
      border-radius: 20px;
      box-shadow: 0 0 20px #8000ff, 0 0 40px #00ffe7;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: crystal-pulse 3s infinite ease-in-out;
    }

    .crystal:hover {
      transform: scale(1.1) rotate(3deg);
      box-shadow: 0 0 30px #fff, 0 0 60px #7b00ff;
    }

    @keyframes crystal-pulse {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="crystal" data-src="https://streams.ilovemusic.de/iloveradio14.mp3"></div>
    <div class="crystal" data-src="http://listen.181fm.com/181-beat_64k.aac"></div>
    <div class="crystal" data-src="http://listen.181fm.com/181-reggae_64k.aac"></div>
    <div class="crystal" data-src="http://listen.181fm.com/181-rock_64k.aac"></div>
  </div>

  <audio id="player" autoplay></audio>

  <script>
    const player = document.getElementById('player');
    const crystals = document.querySelectorAll('.crystal');

    crystals.forEach(crystal => {
      crystal.addEventListener('click', () => {
        const src = crystal.getAttribute('data-src');
        if (src) {
          player.src = src;
          player.play();
        }
      });
    });
  </script>
</body>
</html>
