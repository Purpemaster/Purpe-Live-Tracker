<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purple Pepe Radio</title>
  <style>
    body {
      background: #1a001f;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
    }

    h2 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2rem;
      text-shadow: 0 0 10px #ff00ff;
    }

    .radio-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 440px;
    }

    .radio-station {
      padding: 16px 24px;
      background: linear-gradient(135deg, #6b00b6, #a900ff);
      border-radius: 14px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 12px #a900ff;
      text-align: center;
      width: 100%;
    }

    .radio-station span {
      display: block;
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .radio-station:hover {
      transform: scale(1.03);
      box-shadow: 0 0 18px #ff00ff;
    }

    .radio-station.active {
      background: linear-gradient(135deg, #ff00ff, #9900cc);
      box-shadow: 0 0 25px #ff00ff;
    }

    audio {
      margin-top: 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 12px #6b00b6;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h2>🎧 Purple Pepe Radio</h2>

  <div class="radio-grid">
    <div class="radio-station" data-src="https://alphaboys-live.streamguys1.com/alphaboys.aac">
      🎺 <strong>Purple Kingston</strong>
      <span>Reggae aus der Metaverse-Yard 🇯🇲</span>
    </div>

    <div class="radio-station" data-src="https://streams.ilovemusic.de/iloveradio14.mp3">
      🌙 <strong>Purpe Vibes</strong>
      <span>LoFi für Wallet-Heilung & DAO-Kater</span>
    </div>

    <div class="radio-station" data-src="http://listen.181fm.com/181-beat_64k.aac">
      🔊 <strong>Purpe Flowchain</strong>
      <span>Web3-Bars & Beats für degen movers</span>
    </div>

    <div class="radio-station" data-src="http://listen.181fm.com/181-rock_64k.aac">
      🎸 <strong>Ribbit Rock</strong>
      <span>Frosch mit Gitarre. Mehr musst du nicht wissen.</span>
    </div>
  </div>

  <audio id="pepe-radio" controls autoplay>
    <source src="https://alphaboys-live.streamguys1.com/alphaboys.aac" type="audio/aac">
    Dein Browser kann Purple Pepe Radio nicht abspielen.
  </audio>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const stations = document.querySelectorAll(".radio-station");
      const audio = document.getElementById("pepe-radio");

      stations.forEach(station => {
        station.addEventListener("click", () => {
          stations.forEach(s => s.classList.remove("active"));
          station.classList.add("active");

          const src = station.getAttribute("data-src");
          audio.pause();
          audio.src = src;
          audio.load();
          audio.play().catch(err => {
            console.warn("Autoplay blockiert", err);
          });
        });
      });

      stations[0].classList.add("active");
    });
  </script>
</body>
</html>
